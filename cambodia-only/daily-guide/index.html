<style>
  :root{

    overflow:hidden;box-shadow:var(--shadow);font-family:Helvetica,Arial,sans-serif}

  header.hero p.sub{font-size:18px;margin:.2em auto;max-width:680px;opacity:.95}
  .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
  .facts span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);

  nav.days .row{display:flex;gap:6px;overflow-x:auto;max-width:1080px;margin:0 auto;padding:0 16px}
  nav.days a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-family:Helvetica,Arial,sans-serif;
    font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;white-space:nowrap}
  nav.days a:hover{color:var(--ink);border-color:var(--gold)}
  nav.days a.routemap{color:#fff;background:var(--green);border-color:var(--green);font-weight:700}
  nav.days a.routemap:hover{background:#16463a;border-color:#16463a;color:#fff}
  .region{margin:46px 0 8px;text-align:center}
  .region .lbl{display:inline-block;font-family:Helvetica,Arial,sans-serif;letter-spacing:.18em;
    text-transform:uppercase;font-size:12px;color:#fff;padding:5px 16px;border-radius:999px}
  .region.angkor .lbl{background:var(--gold)} .region.northwest .lbl{background:var(--amber)}
  .region.capital .lbl{background:var(--red)} .region.coast .lbl{background:var(--sky)}
  .region.island .lbl{background:var(--green)}
  .region h2{font-size:26px;margin:.3em 0 .1em} .region p{color:var(--muted);margin:.2em auto;max-width:640px}

    padding:26px 26px 10px;margin:22px 0;scroll-margin-top:64px}
  .day-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:12px}
  .daynum{font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;

  .day-head h3{font-size:23px;margin:0;flex:1 1 100%}
  .day-summary{color:var(--muted);font-style:italic;margin:14px 0 4px}
  .places{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:16px 0 14px}
  @media(max-width:720px){.places{grid-template-columns:1fr}}
  .place{display:flex;flex-direction:column}
  .ph{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#dfe6e0}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .place:hover .ph img{transform:scale(1.05)}
  .ph .ph-label{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:14px;color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;
    background:linear-gradient(135deg,#1f5f4f,#2d6e8e)}
  .ph.broke{background:none}.ph.broke img{display:none}.ph.broke .ph-label{display:flex}
  .place h4{margin:12px 0 4px;font-size:18px}
  .place h4 .tag{font-family:Helvetica,Arial,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .place p{margin:.2em 0 .5em;font-size:15.3px}
  .tip{font-family:Helvetica,Arial,sans-serif;font-size:13px;background:#f3f5ef;border-left:3px solid var(--gold);
    padding:8px 12px;border-radius:0 8px 8px 0;color:#4a5450}
  .tip b{color:var(--ink)}
  .full .places{grid-template-columns:1fr}
  footer{margin:50px 0 30px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);
    font-family:Helvetica,Arial,sans-serif;font-size:13px;text-align:center}
  .legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
  .legend span{font-size:12px}
  .gallery{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#dfe6e0}
  .gallery .track{display:flex;height:100%;transition:transform .35s ease}
  .gallery .slide{flex:0 0 100%;height:100%}
  .gallery .slide img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery .gnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;
    background:rgba(0,0,0,.42);color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
  .gallery .gnav.prev{left:8px}.gallery .gnav.next{right:8px}
  .gallery .gnav:hover{background:rgba(0,0,0,.66)}
  .gallery .gdots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:2}
  .gallery .gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
  .gallery .gdots i.on{background:#fff}
  .gallery .ph-label{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    padding:14px;color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;background:linear-gradient(135deg,#1f5f4f,#2d6e8e);z-index:1}
  .gallery.broke .ph-label{display:flex}
  .gallery.broke .gnav,.gallery.broke .gdots{display:none}
  .gcredit{font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#9aa6b2;margin:5px 2px 0;min-height:14px;line-height:1.3}
  .gcredit a{color:#9aa6b2;text-decoration:none}
  .gcredit a:hover{text-decoration:underline}
</style>

          pl:"„Cytadela kobiet” — mała, różowa, wyrzeźbiona precyzyjniej niż cokolwiek innego w imperium. X wiek, zbudowana nie przez króla, lecz przez królewskiego guru, z piaskowca, który trzyma detal jak drewno. Płaskorzeźby Śiwy i pożaru lasu Khandawa to najlepsze, co jest w Kambodży."},
    tip:{en:"It is small and it fills up. Ten minutes of patience at the central sanctuary usually buys a clear frame.",
         pl:"Jest mała i szybko się zapełnia. Dziesięć minut cierpliwości przy centralnym sanktuarium zwykle daje czyste ujęcie."}},
   {img:"bengmealea",icon:"🌿",name:{en:"Beng Mealea",pl:"Beng Mealea"},
    what:{en:"The same floor plan as Angkor Wat, the same century — and left almost entirely to the forest. You clamber over collapsed galleries and through root-cracked doorways on raised walkways. Forty kilometres out, so far fewer people.",
          pl:"Ten sam plan co Angkor Wat, ten sam wiek — i praktycznie w całości oddana lasowi. Chodzi się po zawalonych galeriach i przez rozsadzone korzeniami przejścia, po podwyższonych pomostach. Czterdzieści kilometrów za miastem, więc ludzi dużo mniej."},
    tip:{en:"The best light here is flat and overcast; harsh sun kills the moss-green depth.",
         pl:"Najlepsze światło jest tu rozproszone, przy zachmurzeniu; ostre słońce zabija zieloną głębię mchu."}},
   {img:"prerup",icon:"⛰",name:{en:"Pre Rup at sunset",pl:"Pre Rup o zachodzie słońca"},
    what:{en:"A tenth-century brick-and-laterite temple-mountain whose name means 'turning the body' — it was probably used for royal cremations. The steep top terrace looks west over the forest canopy and the rice plain, and it is a far calmer sunset than Phnom Bakheng.",
          pl:"Ceglano-lateytowa świątynia-góra z X wieku, której nazwa znaczy „obracanie ciała” — prawdopodobnie służyła królewskim kremacjom. Ze stromego górnego tarasu widok na zachód, ponad koronami lasu i równiną ryżową; zachód dużo spokojniejszy niż na Phnom Bakheng."},
    tip:{en:"The stairs are steep and worn. Go up early, pick your spot, and let the light come to you.",
         pl:"Schody są strome i wytarte. Wejdźcie wcześnie, wybierzcie miejsce i poczekajcie, aż światło samo przyjdzie."}}
  ]},

 {region:"northwest",
  lbl:{en:"The Tonlé Sap & Battambang",pl:"Tonlé Sap i Battambang"},
  rh:{en:"Days 4–5 · eight hours on the water, then the best colonial streets in Cambodia",pl:"Dni 4–5 · osiem godzin na wodzie, potem najlepsze kolonialne ulice w Kambodży"},
  rp:{en:"The signature leg of the whole trip, and the reason the route runs in this direction. A private boat across the great lake and up a jungle river, then two days in the country's most likeable town.",
      pl:"Najbardziej charakterystyczny odcinek całego wyjazdu i powód, dla którego trasa biegnie właśnie tak. Prywatna łódź przez wielkie jezioro i w górę rzeki w dżungli, potem dwa dni w najsympatyczniejszym mieście kraju."}},

 {n:4,date:{en:"Wed 25 Nov",pl:"śr 25 lis"},
  title:{en:"The Tonlé Sap boat to Battambang",pl:"Łodzią przez Tonlé Sap do Battambangu"},
  summary:{en:"06:00 departure by private boat, arriving 14:30–15:00. Eight hours across the lake and up the Sangker river — this is the point of the day, not the problem with it.",
           pl:"Wypłynięcie o 6:00 prywatną łodzią, przypłynięcie 14:30–15:00. Osiem godzin przez jezioro i w górę rzeki Sangker — to jest sens tego dnia, nie jego wada."},
  places:[
   {img:"tonleboat",icon:"🚲",name:{en:"Private charter across the great lake",pl:"Prywatny czarter przez wielkie jezioro"},
    what:{en:"The boat is ours — a private charter included in the package, not tickets on the public boat. It crosses the open Tonlé Sap, Southeast Asia's largest freshwater lake, then narrows into the Sangker river for hours of jungle-lined channel. The service only runs at high water, roughly August to January; late November is comfortably inside it.",
          pl:"Łódź jest nasza — prywatny czarter w pakiecie, a nie bilety na łódź publiczną. Przecina otwarte Tonlé Sap, największe słodkowodne jezioro Azji Południowo-Wschodniej, potem wchodzi w rzekę Sangker i godzinami płynie zarośniętym korytem. Trasa działa tylko przy wysokim stanie wody, mniej więcej od sierpnia do stycznia; koniec listopada mieści się w tym z zapasem."},
    tip:{en:"Hat, sun cream, water, and something for eight hours of engine noise. Sit up top for the views.",
         pl:"Kapelusz, krem, woda i coś na osiem godzin huku silnika. Na górze najlepsze widoki."}},
   {img:"floatvillage",icon:"🌿",name:{en:"Floating villages, stilt houses, flooded forest",pl:"Pływające wioski, domy na palach, zalany las"},
    what:{en:"The whole journey is the sight: entire villages afloat on drums and bamboo, schools and shops and petrol stations among them, children paddling washing-up bowls, fish farms under the houses, and long stretches of forest standing in water.",
          pl:"Sama droga jest atrakcją: całe wioski unoszące się na beczkach i bambusie, między nimi szkoły, sklepy i stacje benzynowe, dzieci wiosłujące w miskach, hodowle ryb pod domami i długie odcinki lasu stojącego w wodzie."},
    tip:{en:"Best light is the first two hours and the last. In between, get out of the sun.",
         pl:"Najlepsze światło jest w pierwsze dwie godziny i w ostatnią. W międzyczasie schowajcie się przed słońcem."}},
   {img:"colonial",icon:"🏛",name:{en:"Battambang's colonial streets",pl:"Kolonialne ulice Battambangu"},
    what:{en:"The evening is a walk through the best-preserved French shophouse streetscape in Cambodia — the riverside blocks around Psar Nath, faded ochre and shutters, largely unrestored and still lived in.",
          pl:"Wieczór to spacer po najlepiej zachowanej francuskiej zabudowie kupieckiej w Kambodży — kwartały nad rzeką wokół Psar Nath, wyblakła ochra i okiennice, w większości nieodnowione i wciąż zamieszkane."},
    tip:{en:"Golden hour on the riverside is the shot. The town is small enough to do entirely on foot.",
         pl:"Złota godzina nad rzeką to to ujęcie. Miasto jest na tyle małe, że da się je obejść w całości pieszo."}}
  ]},

 {n:5,date:{en:"Thu 26 Nov",pl:"czw 26 lis"},
  title:{en:"Bamboo train, Wat Banan, the bat exodus",pl:"Bambusowa kolejka, Wat Banan, wylot nietoperzy"},
  summary:{en:"A bamboo platform on train wheels, two hilltop temples, and several million bats pouring out of a cliff at dusk.",
           pl:"Bambusowa platforma na kolejowych kołach, dwie świątynie na wzgórzach i kilka milionów nietoperzy wysypujących się ze skały o zmierzchu."},
  places:[
   {img:"bambootrain",icon:"🚲",name:{en:"The bamboo train (norry)",pl:"Bambusowa kolejka (norry)"},
    what:{en:"A bamboo platform on two axles with a small motor, running on abandoned French colonial track. When two meet, the lighter one is lifted off, the other passes, and it is put back — which is most of the charm.",
          pl:"Bambusowa platforma na dwóch osiach z małym silnikiem, jeżdżąca po opuszczonych torach z czasów francuskich. Gdy spotkają się dwie, lżejszą zdejmuje się z torów, druga przejeżdża i wraca się ją na miejsce — na tym polega cały urok."},
    tip:{en:"Sit at the front. It is faster and noisier than it looks.",
         pl:"Siadajcie z przodu. Jedzie szybciej i głośniej, niż wygląda."}},
   {img:"watbanan",icon:"🏛",name:{en:"Wat Ek Phnom & Wat Banan",pl:"Wat Ek Phnom i Wat Banan"},
    what:{en:"Wat Ek Phnom is a short stop — an 11th-century ruin beside a modern pagoda. Wat Banan is the one to see: five towers on a hill up 358 steps, eleventh century, and often described as the model Angkor Wat was built from.",
          pl:"Wat Ek Phnom to krótki przystanek — ruina z XI wieku obok współczesnej pagody. Wat Banan to ta warta wejścia: pięć wież na wzgórzu, 358 stopni w górę, XI wiek, często opisywana jako pierwowzór Angkor Wat."},
    tip:{en:"We asked for Wat Banan and got it — at the cost of shortening Wat Ek Phnom. Worth it.",
         pl:"Poprosiliśmy o Wat Banan i dostaliśmy — kosztem skrócenia Wat Ek Phnom. Warto było."}},
   {img:"phnomsampeau",icon:"⛰",name:{en:"Phnom Sampeau & the bat exodus",pl:"Phnom Sampeau i wylot nietoperzy"},
    what:{en:"A limestone hill with a temple on top, wide views over the plain, and the killing caves — a Khmer Rouge execution site, marked now by a reclining Buddha and a glass case of skulls. Then, at dusk, several million wrinkle-lipped bats pour out of a cliff cave in an unbroken ribbon for half an hour.",
          pl:"Wapienne wzgórze ze świątynią na szczycie, szerokim widokiem na równinę i jaskiniami śmierci — miejscem egzekucji Czerwonych Khmerów, dziś ze śpiącym Buddą i gablotą czaszek. A o zmierzchu kilka milionów nietoperzy wylewa się z jaskini w skale nieprzerwaną wstęgą przez pół godziny."},
    tip:{en:"Getting here in good time for the bats is why Wat Ek Phnom was shortened. Be in place by 17:30.",
         pl:"To, żeby zdążyć na nietoperze, jest powodem skrócenia Wat Ek Phnom. Bądźcie na miejscu przed 17:30."}}
  ]},

 {region:"capital",
  lbl:{en:"Udong & Phnom Penh",pl:"Udong i Phnom Penh"},
  rh:{en:"Days 6–7 · the old capital, the new one, and the hardest day of the trip",pl:"Dni 6–7 · stara stolica, nowa i najtrudniejszy dzień wyjazdu"},
  rp:{en:"A long drive broken by a royal hill, then a full day of Phnom Penh — the palace in the morning and the Khmer Rouge sites in the afternoon, with proper space left between them.",
      pl:"Długi przejazd przerwany królewskim wzgórzem, potem pełny dzień w Phnom Penh — pałac rano i miejsca Czerwonych Khmerów po południu, z porządnym odstępem między nimi."}},

 {n:6,date:{en:"Fri 27 Nov",pl:"pt 27 lis"},
  title:{en:"Battambang → Udong → Phnom Penh",pl:"Battambang → Udong → Phnom Penh"},
  summary:{en:"Five to six hours on the road, broken by the hill that was the capital of Cambodia for 250 years, and finished at the National Museum before it closes at 17:00.",
           pl:"Pięć-sześć godzin drogi, przerwane wzgórzem, które przez 250 lat było stolicą Kambodży, i zakończone w Muzeum Narodowym, zanim zamkną o 17:00."},
  places:[
   {img:"udong",icon:"⛰",name:{en:"Udong — the hill of kings",pl:"Udong — wzgórze królów"},
    what:{en:"The royal capital from 1618 until 1866, when the court moved to Phnom Penh. A ridge topped with the stupas of four kings, reached by a long stair, with the plain spread out below. Largely ignored by the standard circuit — which is exactly why we asked for it.",
          pl:"Stolica królewska od 1618 do 1866 roku, gdy dwór przeniósł się do Phnom Penh. Grzbiet zwieńczony stupami czterech królów, dojście długimi schodami, w dole rozpościera się równina. Standardowe trasy je omijają — i właśnie dlatego o nie poprosiliśmy."},
    tip:{en:"Udong is here because Kompong Luong, the floating village, came out to make room. Fair trade — the lake we already saw from the boat.",
         pl:"Udong jest tu dlatego, że wypadło Kompong Luong, pływająca wioska. Uczciwa wymiana — jezioro widzieliśmy już z łodzi."}},
   {img:"natmus",icon:"🏛",name:{en:"The National Museum",pl:"Muzeum Narodowe"},
    what:{en:"The best collection of Khmer sculpture anywhere, in a terracotta pavilion around a courtyard. Pre-Angkorian Funan and Chenla pieces here are the context for Phnom Da on Day 8 — worth seeing in this order rather than the other way round.",
          pl:"Najlepsza kolekcja rzeźby khmerskiej na świecie, w terakotowym pawilonie wokół dziedzińca. Przedangkorskie eksponaty z okresu Funan i Czenli są kontekstem dla Phnom Da z dnia 8. — lepiej obejrzeć w tej kolejności niż odwrotnej."},
    tip:{en:"Closes at 17:00 sharp, which is what makes today's timing tight. The riverfront is a five-minute walk after.",
         pl:"Zamykają punkt 17:00 i to właśnie napina dzisiejszy grafik. Nabrzeże jest pięć minut spacerem stamtąd."}}
  ]},

 {n:7,date:{en:"Sat 28 Nov",pl:"sob 28 lis"},
  title:{en:"Phnom Penh — the palace and the Khmer Rouge",pl:"Phnom Penh — pałac i Czerwoni Khmerzy"},
  summary:{en:"The Royal Palace and Silver Pagoda in the morning; S-21 and Choeung Ek in the afternoon. Nothing else is scheduled, on purpose.",
           pl:"Rano Pałac Królewski i Srebrna Pagoda; po południu S-21 i Choeung Ek. Nic więcej tego dnia nie planujemy — celowo."},
  places:[
   {img:"royalpalace",icon:"🏛",name:{en:"Royal Palace & Silver Pagoda",pl:"Pałac Królewski i Srebrna Pagoda"},
    what:{en:"The working royal residence since 1866, its throne hall spired and gilded above the riverfront. Next to it the Silver Pagoda, floored with five thousand silver tiles and holding an emerald Buddha and a life-size gold one set with more than two thousand diamonds.",
          pl:"Czynna rezydencja królewska od 1866 roku, sala tronowa ze złoconą iglicą nad nabrzeżem. Obok Srebrna Pagoda, wyłożona pięcioma tysiącami srebrnych płytek, z szmaragdowym Buddą i złotym naturalnej wielkości, wysadzanym ponad dwoma tysiącami diamentów."},
    tip:{en:"Shoulders and knees covered — it is enforced. Mornings are cooler and less crowded.",
         pl:"Zakryte ramiona i kolana — sprawdzają. Rano jest chłodniej i mniej ludzi."}},
   {img:"tuolsleng",icon:"🏛",name:{en:"Tuol Sleng (S-21)",pl:"Tuol Sleng (S-21)"},
    what:{en:"A school turned into the Khmer Rouge's main interrogation centre, where around 18,000 people were held and almost none survived. The classrooms, the photographs of the prisoners and the regime's own meticulous records are left as they were found.",
          pl:"Szkoła zamieniona w główne centrum przesłuchań Czerwonych Khmerów, przez które przeszło około 18 000 osób i prawie nikt nie przeżył. Sale lekcyjne, zdjęcia więźniów i skrupulatna dokumentacja reżimu zostawione tak, jak je znaleziono."},
    tip:{en:"Take the audio guide. This is not a place to be walked through quickly.",
         pl:"Weźcie audioprzewodnik. To nie jest miejsce, przez które się przechodzi szybko."}},
   {img:"killingfields",icon:"🏛",name:{en:"Choeung Ek",pl:"Choeung Ek"},
    what:{en:"The killing field 15 km outside the city, where those held at S-21 were brought. A memorial stupa of skulls stands at the centre of a quiet orchard of mass graves. The agency has committed to leaving proper space between here and S-21.",
          pl:"Pole śmierci 15 km za miastem, dokąd przywożono więźniów S-21. W środku cichego sadu masowych grobów stoi pamiątkowa stupa z czaszek. Agencja zobowiązała się zostawić porządny odstęp między tym miejscem a S-21."},
    tip:{en:"Plan a quiet evening. Do not try to fit anything else in after this.",
         pl:"Zaplanujcie spokojny wieczór. Nie próbujcie po tym niczego już dokładać."}}
  ]},

 {region:"coast",
  lbl:{en:"Pre-Angkorian hills, Kampot & Kep",pl:"Przedangkorskie wzgórza, Kampot i Kep"},
  rh:{en:"Days 8–10 · Funan, a French ruin in the cloud forest, and pepper",pl:"Dni 8–10 · Funan, francuska ruina w lesie mgielnym i pieprz"},
  rp:{en:"The drive south is broken by the two oldest sites of the trip, then three nights in Kampot with Bokor, a cave temple and Kep in reach. Warmer and greener than the north.",
      pl:"Przejazd na południe przerywają dwa najstarsze stanowiska wyjazdu, potem trzy noce w Kampocie, z Bokorem, jaskinną świątynią i Kep w zasięgu. Cieplej i bardziej zielono niż na północy."}},

 {n:8,date:{en:"Sun 29 Nov",pl:"niedz 29 lis"},
  title:{en:"Phnom Chisor, Phnom Da, on to Kampot",pl:"Phnom Chisor, Phnom Da, dalej do Kampotu"},
  summary:{en:"Two hills on the way south — one Angkorian, one older than Angkor by five hundred years.",
           pl:"Dwa wzgórza po drodze na południe — jedno angkorskie, drugie starsze od Angkoru o pięćset lat."},
  places:[
   {img:"phnomchisor",icon:"⛰",name:{en:"Phnom Chisor",pl:"Phnom Chisor"},
    what:{en:"An early-11th-century Angkorian temple on a ridge above the plain, reached by a long stair. Laterite and sandstone, half-ruined, with a straight ceremonial axis running down the hillside toward a sacred pond — and a genuinely big view.",
          pl:"Angkorska świątynia z początku XI wieku na grzbiecie nad równiną, dojście długimi schodami. Laterýt i piaskowiec, na wpół zrujnowana, z prostą osią ceremonialną zbiegającą po zboczu ku świętemu stawowi — i naprawdę rozległym widokiem."},
    tip:{en:"The stair is long and unshaded. Go up early in the day.",
         pl:"Schody są długie i bez cienia. Wchodźcie wcześnie."}},
   {img:"phnomda",icon:"🏛",name:{en:"Phnom Da — the pre-Angkorian one",pl:"Phnom Da — ta przedangkorska"},
    what:{en:"Sixth to seventh century, from the Funan and early Chenla period — the only genuinely pre-Angkorian site on the whole trip, and the reason we traded Tonle Bati away to keep it. A square brick tower on a mound near Angkor Borei, in what was once a network of canals and moated cities.",
          pl:"VI–VII wiek, okres Funan i wczesnej Czenli — jedyne naprawdę przedangkorskie stanowisko na całej trasie i powód, dla którego oddaliśmy Tonle Bati, żeby je zachować. Kwadratowa ceglana wieża na kopcu koło Angkor Borei, w miejscu dawnej sieci kanałów i obwarowanych miast."},
    tip:{en:"We go by road. If the Takeo–Angkor Borei canal boat is running in November the agency will add it — a bonus, not a plan.",
         pl:"Jedziemy drogą. Jeśli w listopadzie kursuje łódź kanałem Takeo–Angkor Borei, agencja ją dołoży — to bonus, nie plan."}}
  ]},

 {n:9,date:{en:"Mon 30 Nov",pl:"pon 30 lis"},
  title:{en:"Bokor, a cave temple, and the river at sunset",pl:"Bokor, jaskinna świątynia i rzeka o zachodzie"},
  summary:{en:"The abandoned French hill station in the cloud forest, a 7th-century shrine inside a limestone cave, and a sunset cruise on the Kampot river.",
           pl:"Opuszczone francuskie miasteczko w lesie mgielnym, świątynia z VII wieku w wapiennej jaskini i rejs po rzece Kampot o zachodzie słońca."},
  places:[
   {img:"bokor",icon:"🏛",name:{en:"Bokor Hill Station",pl:"Bokor Hill Station"},
    what:{en:"Built by the French in the 1920s at 1,000 m — a casino, a hotel, a church and villas, put up by forced labour that killed hundreds. Abandoned twice, once by the French and again by the Khmer Rouge, and left to the mist. The Bokor Palace shell and the black church are the trip's headline ruin.",
          pl:"Zbudowane przez Francuzów w latach 20. na wysokości 1000 m — kasyno, hotel, kościół i wille, postawione pracą przymusową, która zabiła setki ludzi. Opuszczone dwukrotnie, raz przez Francuzów, raz przez Czerwonych Khmerów, i zostawione mgle. Skorupa Bokor Palace i czarny kościół to największa ruina wyjazdu."},
    tip:{en:"Bring a layer — it is genuinely cool and often inside cloud up there.",
         pl:"Weźcie coś cieplejszego — na górze jest naprawdę chłodno i często siedzi się w chmurze."}},
   {img:"phnomchhnork",icon:"🌿",name:{en:"Phnom Chhnork",pl:"Phnom Chhnork"},
    what:{en:"A seventh-century brick shrine standing inside a limestone cave, reached across rice fields and up a stair through the karst. Pre-Angkorian, still in use, and startling the first time you see the tower with the cave roof above it.",
          pl:"Ceglana świątynia z VII wieku stojąca wewnątrz wapiennej jaskini, dojście przez pola ryżowe i schodami przez kras. Przedangkorska, wciąż używana, i naprawdę zaskakująca, gdy pierwszy raz widzi się wieżę ze sklepieniem jaskini nad nią."},
    tip:{en:"Head torch helps. Local kids will offer to guide you through the back passage — it is worth it.",
         pl:"Czołówka się przyda. Miejscowe dzieciaki proponują przeprowadzenie tylnym przejściem — warto."}},
   {img:"kampotriver",icon:"⛰",name:{en:"Sunset on the Kampot river",pl:"Zachód słońca na rzece Kampot"},
    what:{en:"Included in the package. A slow boat down the Praek Tuek Chhu with the Bokor massif black against the sunset behind you, mangrove on both banks, and fireflies in the trees on the way back.",
          pl:"W pakiecie. Powolna łódź w dół Praek Tuek Chhu, masyw Bokor czarny na tle zachodu za plecami, namorzyny po obu brzegach i świetliki w drzewach w drodze powrotnej."},
    tip:{en:"The firefly stretch only shows on the way back, after full dark. Don't leave early.",
         pl:"Odcinek ze świetlikami widać dopiero w drodze powrotnej, po całkowitym zmroku. Nie wracajcie za wcześnie."}}
  ]},

 {n:10,date:{en:"Tue 1 Dec",pl:"wt 1 gru"},
  title:{en:"Kampot pepper and Kep",pl:"Pieprz kampocki i Kep"},
  summary:{en:"A pepper plantation, a crab market, and a resort town the 1960s left behind.",
           pl:"Plantacja pieprzu, targ krabów i kurort, który zostały po latach 60."},
  places:[
   {img:"pepper",icon:"🍜",name:{en:"La Plantation",pl:"La Plantation"},
    what:{en:"Kampot pepper is one of the few Cambodian products with a protected geographical indication, and this is where you see how it is grown, picked and sorted — green, black, red and white all from the same vine, at different moments.",
          pl:"Pieprz kampocki to jeden z niewielu kambodżańskich produktów z chronionym oznaczeniem geograficznym, a tu widać, jak się go uprawia, zbiera i sortuje — zielony, czarny, czerwony i biały z tej samej pnączy, tylko w różnych momentach."},
    tip:{en:"Buy here rather than at the market. Fresh green pepper on the stem does not travel, but the dried is the best souvenir on the trip.",
         pl:"Kupujcie tu, nie na targu. Świeży zielony pieprz na gałązce nie przetrwa drogi, ale suszony to najlepsza pamiątka z wyjazdu."}},
   {img:"kep",icon:"🍜",name:{en:"The Kep crab market",pl:"Targ krabów w Kep"},
    what:{en:"Crab pots pulled straight out of the shallows in front of you, cooked with green Kampot pepper on the stem a few metres away. This is the single dish the region is known for, and it is worth the drive on its own.",
          pl:"Kosze z krabami wyciągane z płycizny na waszych oczach, gotowane z zielonym pieprzem kampockim na gałązce kilka metrów dalej. To jedyne danie, z którego ten region słynie, i samo w sobie warte przyjazdu."},
    tip:{en:"Crab with green pepper, and ask for it fresh from the pot rather than the display.",
         pl:"Krab z zielonym pieprzem, i proście prosto z garnka, nie z witryny."}},
   {img:"kepvillas",icon:"🏛",name:{en:"The abandoned villas & Kep National Park",pl:"Opuszczone wille i Park Narodowy Kep"},
    what:{en:"Kep was the Cambodian elite's seaside town in the 1950s and 60s, built in New Khmer Architecture — clean modernist villas above the sea. The Khmer Rouge gutted them and most were never rebuilt: roofless concrete shells in the undergrowth. The national park's 8 km loop track runs above them through the forest.",

let lang="en";
const $=id=>document.getElementById(id);

function setLang(l){
  lang=l; document.documentElement.lang=l;
  try{localStorage.setItem("kh_lang",l);}catch(e){}
  $("btn-en").classList.toggle("on",l==="en");
  $("btn-pl").classList.toggle("on",l==="pl");
  render();
}

function render(){
  const u=UI[lang];
  $("kicker").textContent=u.kicker;
  $("title").textContent=u.title;
  $("sub").textContent=u.sub;
  $("facts").innerHTML=u.facts.map(f=>`<span>${f}</span>`).join("");
  $("legend").innerHTML=u.legend.map(f=>`<span>${f}</span>`).join("");
  $("foot1").textContent=u.foot1;
  $("foot2").textContent=u.foot2;
  document.title="Cambodia 2026 — "+(lang==="pl"?"Przewodnik dzień po dniu":"Day-by-Day Guide");

  const app=$("app"), nav=$("navrow");
  app.innerHTML=""; nav.innerHTML="";
  const rm=document.createElement('a');rm.href='../route-map/index.html';rm.className='routemap';rm.textContent=u.routemap;nav.appendChild(rm);
  DATA.forEach(item=>{
    if(item.region){
      const r=document.createElement('section');
      r.className='region '+item.region;
      r.innerHTML=`<span class="lbl">${item.lbl[lang]}</span><h2>${item.rh[lang]}</h2><p>${item.rp[lang]}</p>`;
      app.appendChild(r);
      return;
    }
    const id='day'+item.n;
    const a=document.createElement('a');a.href='#'+id;a.textContent=u.day+' '+item.n;nav.appendChild(a);
    const d=document.createElement('section');
    d.className='day'+(item.places.length===1?' full':'');
    d.id=id;
    const ph=item.places.map(p=>`
       <div class="place">
         <div class="gallery broke" data-img="${p.img}"><div class="track"></div>
              <button class="gnav prev" aria-label="Previous photo">‹</button>
              <button class="gnav next" aria-label="Next photo">›</button>
              <div class="gdots"></div><span class="ph-label">${p.name[lang]}</span></div>
         <div class="gcredit"></div>
         <h4>${p.icon} ${p.name[lang]}</h4>
         <p>${p.what[lang]}</p>
         <div class="tip"><b>${u.tip}</b> ${p.tip[lang]}</div>
       </div>`).join('');
    d.innerHTML=`
      <div class="day-head">
        <span class="daynum">${u.DAY} ${item.n}</span>
        <span class="date">${item.date[lang]}</span>
        <h3>${item.title[lang]}</h3>
      </div>
      <p class="day-summary">${item.summary[lang]}</p>
      <div class="places">${ph}</div>`;
    app.appendChild(d);
  });
  buildGalleries();
}

// Build a swipeable photo carousel per card from a tuned Wikimedia Commons search
// (JSONP, so it works from a local file:// page). Seeds a known-good image first
// where available, then appends landscape search results with per-photo credit.
const COMMONS='https://commons.wikimedia.org/';
function stripHTML(h){const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').replace(/\s+/g,' ').trim();}
function buildGalleries(){
  document.querySelectorAll('.gallery[data-img]').forEach((g,gi)=>{
    if(g.dataset.done) return; g.dataset.done="1";
    const key=g.getAttribute('data-img');
    const seed=SEED[key], slides=[];
    if(seed){ slides.push({src:COMMONS+'wiki/Special:FilePath/'+encodeURIComponent(seed)+'?width=1200',
                           page:COMMONS+'wiki/File:'+encodeURIComponent(seed), credit:''}); }
    // Tuned term first, then a broader one, then a plain country search. We stop at the
    // first query that actually yields a usable landscape photo.
    const queries=[QUERY[key]||key, FALLBACK[key]||"Cambodia", "Cambodia"];
    let qi=0, calls=0, found=0;

    function collect(data){
      const pages=data&&data.query&&data.query.pages; if(!pages) return;
      Object.keys(pages).map(k=>pages[k]).sort((a,b)=>(a.index||99)-(b.index||99)).forEach(pg=>{
        if(slides.length>=5) return;
        const ii=pg.imageinfo&&pg.imageinfo[0]; if(!ii) return;
        if(ii.mime&&ii.mime.indexOf('image/')!==0) return;
        if(ii.width&&ii.height&&ii.width<ii.height*0.95) return; // landscape only
        const file=pg.title.replace(/^File:/,'');
        if(seed&&file===seed) return;
        const md=ii.extmetadata||{};
        const artist=stripHTML(md.Artist&&md.Artist.value);
        const lic=(md.LicenseShortName&&md.LicenseShortName.value)||'';
        slides.push({src:ii.thumburl||ii.url, page:ii.descriptionurl,
                     credit:[artist,lic].filter(Boolean).join(' · ')});
        found++;
      });
    }

    function next(){
      if(found>0 || qi>=queries.length){ renderCarousel(g,slides); return; }
      const q=queries[qi++];
      const cb='__gc'+gi+'_'+(calls++)+'_'+Date.now();
      const s=document.createElement('script');
      const cleanup=function(){ try{delete window[cb];}catch(e){} s.remove(); };
      window[cb]=function(data){ try{ collect(data); }catch(e){} cleanup(); next(); };
      s.onerror=function(){ cleanup(); next(); };
      s.src=COMMONS+'w/api.php?action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=24'
          +'&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')
          +'&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=1200&callback='+cb;
      document.body.appendChild(s);
    }
    next();
  });
}
function renderCarousel(g,slides){
  const credit=g.parentNode.querySelector('.gcredit');
  if(!slides.length) return;                 // leave the labelled placeholder
  g.classList.remove('broke');
  const track=g.querySelector('.track'), dots=g.querySelector('.gdots');
  track.innerHTML=slides.map(s=>'<div class="slide"><img loading="lazy" alt="" src="'+s.src+'"></div>').join('');
  dots.innerHTML=slides.map((_,i)=>'<i class="'+(i?'':'on')+'"></i>').join('');
  let idx=0;
  function show(i){
    idx=(i+slides.length)%slides.length;
    track.style.transform='translateX('+(-idx*100)+'%)';
    dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===idx));
    if(credit){ const s=slides[idx];
      credit.innerHTML = s.credit ? '📷 <a href="'+(s.page||'#')+'" target="_blank" rel="noopener">'+s.credit+'</a>'
                                  : (s.page?'📷 <a href="'+s.page+'" target="_blank" rel="noopener">Wikimedia Commons</a>':''); }
  }
  g.querySelector('.prev').onclick=()=>show(idx-1);
  g.querySelector('.next').onclick=()=>show(idx+1);
  if(slides.length<2){ g.querySelector('.prev').style.display='none'; g.querySelector('.next').style.display='none'; dots.style.display='none'; }
  let x0=null;
  g.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  g.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) show(idx+(dx<0?1:-1)); x0=null; });
  show(0);
}

  if(s==="pl"||s==="en"){saved=s;}

}catch(e){}
